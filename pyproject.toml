[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "buscadin-jobs-bot"
version = "0.1.0"
description = "Private Telegram bot for curated remote job opportunities"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.29,<1",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "playwright>=1.55,<2",
    "beautifulsoup4>=4.13,<5",
]

[project.scripts]
buscadin = "buscadin_bot.cli:main"
buscadin-portal = "buscadin_bot.web.portal:main"
buscadin-admin = "buscadin_bot.web.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/buscadin_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
